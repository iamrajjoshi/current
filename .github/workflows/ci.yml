name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate release scripts
        run: |
          bash -n scripts/notarize-app.sh scripts/update-homebrew-cask.sh
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run Swift package tests and feature checks
        run: scripts/validate-local.sh all 2>&1 | tee "$RUNNER_TEMP/package-tests.log"

      - name: Preserve package test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-test-diagnostics
          path: |
            ${{ runner.temp }}/package-tests.log
            ~/Library/Logs/DiagnosticReports/*testing*.ips
            ~/Library/Logs/DiagnosticReports/*CurrentFeature*.ips
          if-no-files-found: ignore
          retention-days: 7

      - name: Build macOS app
        run: xcodebuild -workspace Current.xcworkspace -scheme Current -destination 'platform=macOS' build

      - name: Run macOS tests
        run: xcodebuild -workspace Current.xcworkspace -scheme Current -destination 'platform=macOS' test

  website:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build website
        working-directory: website
        run: pnpm build
