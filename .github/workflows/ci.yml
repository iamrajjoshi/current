name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install XcodeBuildMCP
        run: npm install --global xcodebuildmcp@2.3.2

      - name: Run Swift package tests
        run: xcodebuildmcp swift-package test --package-path CurrentPackage

      - name: Run feature checks
        run: xcodebuildmcp swift-package run --package-path CurrentPackage --executable-name CurrentFeatureChecks

      - name: Build macOS app
        run: xcodebuildmcp macos build --workspace-path Current.xcworkspace --scheme Current

      - name: Run macOS tests
        run: xcodebuildmcp macos test --workspace-path Current.xcworkspace --scheme Current

  website:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build website
        working-directory: website
        run: pnpm build
