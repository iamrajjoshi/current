name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (three numbers, for example 0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: current-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Set temporary paths
        run: |
          printf '%s\n' "DERIVED_DATA_PATH=$RUNNER_TEMP/current-release-build" \
            "DIST_DIR=$RUNNER_TEMP/current-dist" \
            "KEYCHAIN_PATH=$RUNNER_TEMP/current-signing.keychain-db" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate release and credentials
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must contain three numbers, for example 0.3.0"
            exit 1
          fi
          missing=0
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD HOMEBREW_TAP_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name (see docs/releases.md)"
              missing=1
            fi
          done
          [[ "$missing" == 0 ]]
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a ten-character Apple Developer team ID"
            exit 1
          fi
          existing_release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"v$RELEASE_VERSION\") | .html_url")
          if [[ -n "$existing_release" ]]; then
            echo "::error::Release or draft v$RELEASE_VERSION already exists: $existing_release. See docs/releases.md before retrying."
            exit 1
          fi
          existing_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq '.[].ref')
          if printf '%s\n' "$existing_tags" | grep -Fxq "refs/tags/v$RELEASE_VERSION"; then
            echo "::error::Tag v$RELEASE_VERSION already exists; use a new version"
            exit 1
          fi
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Swift package tests and feature checks
        run: scripts/validate-local.sh all

      - name: Import Developer ID signing certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/current-certificate.p12"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          identities=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/"Developer ID Application:/ {print $2}')
          if [[ ! "$identities" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo "::error::The certificate must contain exactly one valid Developer ID Application identity and its private key"
            exit 1
          fi
          printf 'identity=%s\n' "$identities" >> "$GITHUB_OUTPUT"

      - name: Build signed universal Release app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          xcodebuild -workspace Current.xcworkspace -scheme Current \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            "MARKETING_VERSION=$RELEASE_VERSION" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES \
            "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            "OTHER_CODE_SIGN_FLAGS=--timestamp --keychain $KEYCHAIN_PATH" build

      - name: Notarize, staple, and verify final archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          scripts/notarize-app.sh \
            "$DERIVED_DATA_PATH/Build/Products/Release/Current.app" \
            "$RELEASE_VERSION" "$DIST_DIR"

      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/current-certificate.p12"

      - name: Preserve notarization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIST_DIR }}/notarization/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            "$DIST_DIR/Current-$RELEASE_VERSION.zip" \
            "$DIST_DIR/Current-$RELEASE_VERSION.zip.sha256" \
            --title "Current $RELEASE_VERSION" --target "$GITHUB_SHA" --generate-notes

  homebrew:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # A failed tap job can be rerun using the exact published bytes.
      - name: Download and verify published archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "v$RELEASE_VERSION" --dir dist \
            --pattern "Current-$RELEASE_VERSION.zip" \
            --pattern "Current-$RELEASE_VERSION.zip.sha256"
          cd dist
          shasum -a 256 --check "Current-$RELEASE_VERSION.zip.sha256"

      - name: Update Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/update-homebrew-cask.sh "$RELEASE_VERSION" "dist/Current-$RELEASE_VERSION.zip"

      - name: Validate Homebrew cask
        run: |
          brew tap iamrajjoshi/tap
          brew update
          brew info --cask iamrajjoshi/tap/current
          brew fetch --cask --force iamrajjoshi/tap/current
